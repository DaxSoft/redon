[package]
name = "redon"
version = "0.1.0"
description = "Redon Redis GUI Inspector"
authors = ["Michael Willian Santos"]
license = "MIT"
repository = "https://github.com/DaxSoft/redon"
edition = "2021"

[lib]
name = "redon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
